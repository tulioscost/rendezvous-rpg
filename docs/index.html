<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RENDEZVOUS — Ficha em Quadrinhos</title>
<meta name="description" content="Ficha de RENDEZVOUS em páginas de quadrinhos com animação de passagem e criador modular de poderes.">
<link rel="stylesheet" href="./comic-sheet.css"><style>
body{background:#0a0b13;color:#fff;margin:0;font-family:Arial,sans-serif}
.demo-shell{max-width:1140px;margin:auto;padding:16px}
.demo-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:9px;margin-bottom:12px}
.demo-top h1{margin:0;font:900 25px Impact,Arial,sans-serif}.demo-top p{font-size:12px;margin:4px 0;color:#aeb8d5}
.demo-actions{display:flex;gap:8px;flex-wrap:wrap}
.demo-actions button{border:2px solid #f1e8d8;background:#ef4655;color:white;padding:9px 12px;font-weight:800;cursor:pointer}
.demo-book{height:860px;border:4px solid #fff0dd;box-shadow:12px 13px 0 #c42740}
.demo-shell .rdv-book{height:100%}
.demo-shell .rdv-comic-page{scrollbar-width:thin}
.demo-shell .rdv-portrait{object-fit:cover}
.demo-toast{min-height:20px;color:#ffce4e;font-size:12px;margin-top:12px}
@media(max-width:620px){.demo-shell{padding:5px}.demo-book{height:800px}.demo-top{padding:8px}.demo-actions button{font-size:11px;padding:6px}.demo-shell .rdv-page-counter{font-size:12px}}
</style></head><body><div class="demo-shell"><div class="demo-top"><div><h1>RENDEZVOUS <small>◈ FICHA DIGITAL</small></h1><p>Prévia independente • Dados salvos neste navegador • Foundry VTT disponível no pacote</p></div>
<div class="demo-actions"><button id="export-json">EXPORTAR JSON</button><button id="import-json">IMPORTAR JSON</button><button id="change-hero">TROCAR IMAGEM</button><button id="sample">CARREGAR VÉRTICE</button><button id="clear">LIMPAR</button><input id="json-file" type="file" accept="application/json,.json" hidden><input id="hero-file" type="file" accept="image/*" hidden></div></div>
<div class="rendezvous demo-book"><div class="rdv-book" id="app" tabindex="0" aria-label="Ficha RENDEZVOUS"></div></div><div id="toast" class="demo-toast" aria-live="polite"></div></div><script type="module" src="./web-app.mjs"></script></body></html>
